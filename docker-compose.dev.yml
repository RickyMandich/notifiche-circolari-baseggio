services:
  app:
    build: .
    image: notifiche-circolari-baseggio:dev
    container_name: notifiche-circolari-baseggio_app_dev
    restart: unless-stopped
    volumes:
      - ./storage:/var/www/html/storage
      - ./.env:/var/www/html/.env:ro
      - ./public/build:/var/www/html/public/build
    environment:
      - DB_HOST=db
      - DB_DATABASE=notifiche-circolari-baseggio
      - DB_USERNAME=notifiche-circolari-baseggio
      - DB_PASSWORD=${DB_PASSWORD}
    networks:
      internal:
        ipv4_address: 172.40.0.10
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: notifiche-circolari-baseggio_nginx_dev
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
      - ./storage/app/public:/var/www/html/storage/app/public:ro
    networks:
      - internal
    depends_on:
      - app

  db:
    image: mariadb:11
    container_name: notifiche-circolari-baseggio_db_dev
    restart: unless-stopped
    ports:
      - 3306:3306
    environment:
      - MYSQL_ALLOW_EMPTY_PASSWORD=yes
      - MYSQL_DATABASE=notifiche-circolari-baseggio
    volumes:
      - db_data_dev:/var/lib/mysql
      - ./docker/mysql/init.dev.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - internal
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  worker:
    image: notifiche-circolari-baseggio:dev
    container_name: notifiche-circolari-baseggio_worker_dev
    restart: unless-stopped
    command: php artisan queue:work --max-time=3600
    volumes:
      - ./storage:/var/www/html/storage
      - ./.env:/var/www/html/.env:ro
    environment:
      - DB_HOST=db
      - DB_DATABASE=notifiche-circolari-baseggio
      - DB_USERNAME=notifiche-circolari-baseggio
      - DB_PASSWORD=${DB_PASSWORD}
    networks:
      internal:
        ipv4_address: 172.40.0.11
    depends_on:
      db:
        condition: service_healthy

networks:
  internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.40.0.0/24

volumes:
  db_data_dev:
